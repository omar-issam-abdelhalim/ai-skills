<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: app shell with a sticky top bar; dashboard grid, focused session view with side navigator in exam mode.
   Palette is strictly black / white / yellow. Yellow is only ever a fill with black text (never yellow text on white). */
:root{
  --bg:#f3f3f0; --surface:#ffffff; --sunk:#f7f7f4; --ink:#0d0d0d; --muted:#5f5f5b; --line:#e0e0da; --line-strong:#0d0d0d;
  --yellow:#ffd60a; --yellow-soft:#fff6c7; --on-yellow:#0d0d0d; --inv-bg:#0d0d0d; --inv-ink:#ffffff;
  --font:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; --font-ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a; --surface:#141414; --sunk:#101010; --ink:#f2f2f0; --muted:#9b9b96; --line:#262626; --line-strong:#f2f2f0;
  --yellow:#ffd60a; --yellow-soft:#2a2406; --on-yellow:#0d0d0d; --inv-bg:#f2f2f0; --inv-ink:#0d0d0d; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --surface:#141414; --sunk:#101010; --ink:#f2f2f0; --muted:#9b9b96; --line:#262626; --line-strong:#f2f2f0;
  --yellow:#ffd60a; --yellow-soft:#2a2406; --on-yellow:#0d0d0d; --inv-bg:#f2f2f0; --inv-ink:#0d0d0d; color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:700} h2{font-size:1.15rem;font-weight:600} h3{font-size:1rem;font-weight:600}
p{margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ar{font-family:var(--font-ar);unicode-bidi:plaintext;text-align:start;line-height:1.75}
.ar li{unicode-bidi:plaintext}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:7px;background:var(--yellow);color:var(--on-yellow);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:.8rem}
.brand b{font-weight:600}
.brand span{color:var(--muted);font-size:.85rem}
.nav{display:flex;gap:2px;margin-inline-start:auto;overflow-x:auto}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav button:hover{color:var(--ink);background:var(--sunk)}
.nav button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--yellow)}
.count{font-family:var(--mono);font-size:.7rem;background:var(--yellow);color:var(--on-yellow);border-radius:999px;padding:0 6px;line-height:1.5}
.nav .sh{display:none}
@media (max-width:720px){.brand span,.brand b{display:none}.nav .lg{display:none}.nav .sh{display:inline}.topbar-in{gap:10px;padding:0 12px}.nav button{padding:8px 8px;font-size:.88rem}}

main{max-width:1120px;margin:0 auto;padding:28px 20px 80px;display:flex;flex-direction:column;gap:22px}
@media (max-width:720px){main{padding:20px 14px 60px}}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sunk)}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow)}
.btn.primary:hover:not(:disabled){filter:brightness(.95);background:var(--yellow)}
.btn.dark{background:var(--inv-bg);border-color:var(--inv-bg);color:var(--inv-ink)}
.btn.dark:hover:not(:disabled){opacity:.9;background:var(--inv-bg)}
.btn.quiet{border-color:var(--line)}
.btn.sm{height:32px;padding:0 12px;font-size:.82rem}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn kbd{font-size:.68rem}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.btn:focus-visible{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink);outline:none}
kbd{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--surface)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.74rem;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.hl{display:inline-flex;align-items:center;font-family:var(--mono);font-size:.72rem;background:var(--yellow);color:var(--on-yellow);border-radius:4px;padding:2px 7px;font-weight:600;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.85rem;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--inv-bg);color:var(--inv-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:.85rem;font-weight:500}
.chip small{font-family:var(--mono);color:var(--muted);font-size:.72rem}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--inv-bg);color:var(--inv-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.9rem;user-select:none}
.toggle input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle input:checked{background:var(--yellow)}
.toggle input:checked::after{transform:translateX(14px);background:var(--on-yellow)}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:.78rem;font-weight:600;color:var(--muted)}
.track{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:var(--yellow);border-radius:999px}

/* dashboard */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero p{color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--mono);font-size:1.6rem;font-weight:500;line-height:1.1}
.stat .v small{font-size:.85rem;color:var(--muted);font-weight:400}
.stat .k{font-size:.8rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
@media (max-width:880px){.two{grid-template-columns:1fr}}
.builder{display:flex;flex-direction:column;gap:18px}
.builder-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.mock{display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px}
.facts div{padding:10px 12px;display:flex;flex-direction:column}
.facts div+div{border-inline-start:1px solid var(--line)}
.facts b{font-family:var(--mono);font-size:1.1rem;font-weight:500}
.facts span{font-size:.75rem;color:var(--muted)}
.notes{border:1px solid var(--line);border-inline-start:4px solid var(--yellow);border-radius:var(--r);background:var(--surface);padding:16px 18px}
.notes ul{margin:8px 0 0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.notes mark{background:var(--yellow);color:var(--on-yellow);padding:0 4px;border-radius:3px}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--inv-bg);color:var(--inv-ink);border-radius:var(--r);padding:14px 18px}
.banner .btn{border-color:var(--inv-ink);color:var(--inv-ink)}
.banner .btn.primary{border-color:var(--yellow);color:var(--on-yellow)}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 10px 10px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.table td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table .lec{font-family:var(--mono);font-weight:500}
.table .mast{min-width:140px}
.table .mast .row{gap:8px;flex-wrap:nowrap}
.table .mast .track{flex:1}
.scroll-x{overflow-x:auto}
.prio{font-family:var(--mono);font-size:.7rem;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.prio.top{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow);font-weight:600}
@media (max-width:620px){.table .hide-s{display:none}}

/* session */
.sess-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sess-head .title{display:flex;flex-direction:column;gap:2px}
.sess-head .title b{font-size:1.05rem}
.timer{font-family:var(--mono);font-size:1rem;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--surface)}
.timer.low{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
.tally{display:flex;gap:14px;font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.tally b{color:var(--ink);font-weight:500}
.pbar{height:4px;background:var(--line);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ink);transition:width .2s}
.sgrid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.sgrid.exam{grid-template-columns:1fr 260px}
@media (max-width:880px){.sgrid.exam{grid-template-columns:1fr}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:18px}
@media (max-width:620px){.qcard{padding:18px}}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qno{font-family:var(--mono);font-size:.8rem;color:var(--muted);margin-inline-start:auto}
.qtext{font-size:1.18rem;font-weight:500;line-height:1.5;letter-spacing:-.005em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:13px 14px;cursor:pointer;font-size:.98rem;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .let{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--muted);margin-top:-1px}
.opt .txt{flex:1}
.opt .st{display:block;font-family:var(--mono);font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;text-decoration:none}
.opt.picked .st{display:block}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.sel .let{background:var(--inv-bg);color:var(--inv-ink);border-color:var(--inv-bg)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow)}
.opt.correct .let{background:var(--on-yellow);color:var(--yellow);border-color:var(--on-yellow)}
.opt.picked{border:2px solid var(--line-strong);padding:12px 13px}
.opt.picked .t{text-decoration:line-through;text-decoration-thickness:1.5px}
.opt.picked .let{background:var(--inv-bg);color:var(--inv-ink);border-color:var(--inv-bg)}
.opt.dim{opacity:.5}
.verdict{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:9px;padding:12px 14px}
.verdict.ok{background:var(--yellow-soft);border:1px solid var(--yellow)}
.verdict.no{background:var(--inv-bg);color:var(--inv-ink)}
.verdict b{font-size:.95rem}
.verdict .btn{height:34px}
.verdict.no .btn{border-color:var(--inv-ink);color:var(--inv-ink)}
.verdict.no .btn:hover{background:transparent;opacity:.85}
.qfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.hints{font-size:.75rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:620px){.hints{display:none}}

/* explanation (Arabic) */
.explain{display:flex;flex-direction:column;gap:10px;font-family:var(--font-ar);text-align:start}
.ex-key{unicode-bidi:plaintext;text-align:start;background:var(--yellow-soft);border:1px solid var(--yellow);border-radius:9px;padding:12px 14px;line-height:1.8;font-size:.95rem}
.ex-key .lbl{display:block;font-weight:700;font-size:.8rem;margin-bottom:2px}
.ex-row{border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;direction:ltr;text-align:left}
.ex-row .eh{display:flex;align-items:flex-start;gap:12px}
.ex-row .let{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--muted)}
.ex-row .o{flex:1;font-family:var(--font);font-weight:500;font-size:.93rem;padding-top:2px}
.ex-row .s{flex:none;font-family:var(--mono);font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.ex-row.c{border-color:var(--yellow);box-shadow:inset 4px 0 0 var(--yellow)}
.ex-row.c .let,.ex-row.c .s{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow)}
.ex-row.p{border:2px solid var(--line-strong);padding:11px 13px}
.ex-row.p .let,.ex-row.p .s{background:var(--inv-bg);color:var(--inv-ink);border-color:var(--inv-bg)}
.ex-row .e{font-family:var(--font-ar);unicode-bidi:plaintext;text-align:start;font-size:.93rem;line-height:1.8;margin:0;padding-inline-start:38px}
@media (max-width:620px){.ex-row .e{padding-inline-start:0}.ex-row .s{display:none}.ex-row.c .s,.ex-row.p .s{display:inline-block}}

/* navigator */
.navp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:76px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pal button{height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--mono);font-size:.8rem;position:relative}
.pal button.a{background:var(--inv-bg);color:var(--inv-ink);border-color:var(--inv-bg)}
.pal button.f::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 1.5px var(--surface)}
.pal button.cur{box-shadow:0 0 0 2px var(--yellow)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.78rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block;position:relative}
.legend i.a{background:var(--inv-bg);border-color:var(--inv-bg)}
.legend i.f::after{content:"";position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--yellow)}

/* results */
.res-top{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
@media (max-width:620px){.res-top{grid-template-columns:1fr;gap:16px}}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:var(--mono);font-size:1.7rem;font-weight:500;display:block;line-height:1}
.ring .c span{font-size:.75rem;color:var(--muted)}
.res-meta{display:flex;flex-direction:column;gap:8px}
.grade{display:inline-flex;align-self:flex-start;font-family:var(--mono);font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:5px;background:var(--inv-bg);color:var(--inv-ink);text-transform:uppercase;letter-spacing:.06em}
.grade.top{background:var(--yellow);color:var(--on-yellow)}
.lrows{display:flex;flex-direction:column;gap:12px}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) 140px 56px;gap:12px;align-items:center;font-size:.88rem}
.lrow .n{font-family:var(--mono);font-weight:500}
.lrow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .v{font-family:var(--mono);text-align:right;color:var(--muted)}
@media (max-width:620px){.lrow{grid-template-columns:40px 1fr 52px}.lrow .t{display:none}}
.focus-list{display:flex;flex-direction:column;gap:8px}
.focus-item{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.focus-item .n{font-family:var(--mono);font-weight:600;background:var(--yellow);color:var(--on-yellow);border-radius:5px;padding:2px 7px;font-size:.8rem}
.focus-item .d{flex:1;min-width:180px;font-size:.9rem}
.rev{display:flex;flex-direction:column;gap:10px}
.ritem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ritem summary{cursor:pointer;list-style:none;display:flex;gap:14px;align-items:flex-start;padding:14px 16px}
.ritem summary::-webkit-details-marker{display:none}
.ritem .rn{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:26px;padding-top:2px}
.ritem .rq{flex:1;display:flex;flex-direction:column;gap:6px}
.ritem .rs{font-family:var(--mono);font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:4px;white-space:nowrap;align-self:flex-start}
.ritem .rs.ok{background:var(--yellow);color:var(--on-yellow)}
.ritem .rs.no{background:var(--inv-bg);color:var(--inv-ink)}
.ritem .rs.skip{border:1px solid var(--line);color:var(--muted)}
.ritem .chev{color:var(--muted);transition:transform .15s;padding-top:2px}
.ritem[open] .chev{transform:rotate(90deg)}
.ritem .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}

/* guide */
.guide{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
@media (max-width:880px){.guide{grid-template-columns:1fr}.toc{position:static !important}}
.toc{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:10px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--muted);font-size:.88rem}
.toc a:hover{background:var(--surface);color:var(--ink)}
.toc a b{font-family:var(--mono);font-weight:500;color:var(--ink);min-width:28px}
.gsec{scroll-margin-top:80px;display:flex;flex-direction:column;gap:14px}
.gsec ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.traps{border-top:1px solid var(--line);padding-top:12px;font-size:.9rem}
.traps .lbl{font-family:var(--font);direction:ltr;text-align:left;display:block;margin-bottom:6px}

.model{display:flex;flex-direction:column;gap:10px}
.model-a{border:1px solid var(--line);border-inline-start:4px solid var(--yellow);border-radius:9px;padding:14px 16px;background:var(--sunk);line-height:1.65}
.model-a p+p{margin-top:8px}.model-a ul,.model-a ol{margin:6px 0;padding-inline-start:20px}
.write-hint{border:1px dashed var(--line);border-radius:9px;padding:14px 16px;color:var(--muted);font-size:.9rem}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.hidden{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <div class="brand"><div class="logo" id="logo">EL</div><div><b id="brandName">Exam Lab</b> <span id="brandSub"></span></div></div>
  <nav class="nav" aria-label="Main">
    <button data-nav="dash"><span class="lg">Dashboard</span><span class="sh">Home</span></button>
    <button data-nav="mock"><span class="lg">Mock Exam</span><span class="sh">Mock</span></button>
    <button data-nav="guide"><span class="lg">Study Guide</span><span class="sh">Guide</span></button>
    <button data-nav="mistakes"><span class="lg">Mistakes</span><span class="sh">Mistakes</span> <span class="count" id="mcount"></span></button>
  </nav>
</div></header>
<main id="view"></main>
<div id="modal"></div>
<script>
"use strict";
/*__DATA_START__*/
// Example Exam Lab dataset: every question shape, valid under scripts/check.js.
// Build it with:  python3 scripts/build.py assets/template.html assets/example-data.js demo.html
const CONFIG={
  course:"Intro to Psychology", exam:"Quiz 1",
  subtitle:"Lectures 1–2 · Example dataset · MCQ + T/F + written",
  lectures:[
    {id:"L1",name:"Perception",prio:"High"},
    {id:"L2",name:"Memory",prio:"Medium"}
  ],
  mock:{enabled:true,minutes:10},
  notes:["<mark>Highest weight</mark>: perception (L1)."],
  style:["4-option MCQ, a few True/False statements, one short written definition."],
  accent:null,
  storageKey:"examlab_example_psych_quiz1"
};

const B=[
{l:"L1",h:1,q:"Top-down processing in perception means that:",
 o:[["Expectations shape what we perceive","Correct: interpretation is guided by what we already know and expect."],
    ["Perception is built only from raw sensory input, step by step","That describes bottom-up processing, the opposite direction."],
    ["Sensory receptors adapt to a constant stimulus","That is sensory adaptation, a different concept from the same lecture."],
    ["Attention is limited to a single stimulus at a time","That is a claim about selective attention, not about processing direction."]],
 k:"Top-down = knowledge → perception; bottom-up = stimulus → perception."},
{l:"L1",t:"tf",q:"Statement: two people watching the same event always perceive it the same way.",
 o:[["False","Expectations and motives change what each observer notices and remembers."],["True","Not true: perception is an active interpretation, not a passive copy."]],
 k:"Perception is interpretation, so observers can legitimately differ."},
{l:"L2",q:"Which memory store holds information for only a fraction of a second to a few seconds?",
 o:[["Sensory memory","Correct: sensory memory holds a brief, high-capacity trace of the input."],
    ["Short-term memory","Short-term memory lasts around 20–30 seconds without rehearsal."],
    ["Long-term memory","Long-term memory is durable and has no practical time limit."],
    ["Procedural memory","Procedural memory is a type of long-term memory for skills."]],
 k:"Sensory → short-term → long-term, from shortest to longest duration."},
{l:"L2",t:"tf",q:"Statement: rehearsal helps move information from short-term to long-term memory.",
 o:[["True","Rehearsal, especially elaborative rehearsal, supports encoding into long-term memory."],["False","Not false: rehearsal is a standard route into long-term memory."]],
 k:"Rehearsal is the bridge from short-term to long-term memory."},
{l:"L2",t:"written",q:"Define encoding and give one example.",
 a:"<p><b>Encoding</b> is the process of converting information into a form that can be stored in memory.</p><p>Example: linking a new term to a vivid image so it is easier to remember later.</p>",
 k:"Encoding is the first stage: encoding → storage → retrieval."}
];

const M=[
{l:"L1",q:"A reader skims past a typo without noticing it. Which process best explains this?",
 o:[["Top-down processing","Correct: expectations make the reader see the intended word."],
    ["Bottom-up processing of each individual letter","Careful letter-by-letter processing would catch the typo."],
    ["Sensory adaptation to printed text","Adaptation is about constant stimuli fading, not about typos."],
    ["Retrieval failure from long-term memory","The word is recognised, so retrieval is not the issue."]],
 k:"Expectation can override the actual input."},
{l:"L2",t:"tf",q:"Statement: memory works like a video recording that can be replayed exactly.",
 o:[["False","Memory is reconstructive: recall rebuilds events and can change them."],["True","Not true: memories are reconstructed, not replayed."]],
 k:"Memory is reconstructive, not a recording."}
];

const G={
  L1:{pts:["<b>Top-down</b> vs <b>bottom-up</b> processing: direction of influence.","Perception is an active interpretation of sensory input."],
      traps:["Confusing sensory adaptation with top-down processing."]},
  L2:{pts:["Three stores: <b>sensory</b>, <b>short-term</b>, <b>long-term</b>.","Stages: encoding → storage → retrieval."],
      traps:["Treating memory as an exact recording."]}
};

/*__DATA_END__*/

/* ================= core ================= */
B.forEach((q,i)=>q.id="b"+i); M.forEach((q,i)=>q.id="m"+i);
const ALL={}; [...B,...M].forEach(q=>{q.t=q.t||"mcq";ALL[q.id]=q;});
const LECS=CONFIG.lectures.map(x=>x.id);
const LNAME={},PRIO={}; CONFIG.lectures.forEach(x=>{LNAME[x.id]=x.name;PRIO[x.id]=x.prio||"";});
const MOCK=CONFIG.mock&&CONFIG.mock.enabled&&M.length>0;
const EXAM_MIN=(CONFIG.mock&&CONFIG.mock.minutes)||30;
const LET="ABCDE";
const scorable=q=>q.t!=="written";
const HAS_WRITTEN=B.some(q=>q.t==="written");
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pct=(a,b)=>b?Math.round(a/b*100):0;
const isTop=p=>/very high|top|critical/i.test(p||"");
function orderFor(q){
  if(q.t==="written")return [];
  if(q.t==="tf"){const ti=q.o.findIndex(o=>/^true$/i.test(o[0]));return ti===1?[1,0]:[0,1];}
  return shuffle(q.o.map((_,i)=>i));
}
if(CONFIG.accent){document.documentElement.style.setProperty("--yellow",CONFIG.accent);}
document.title=`${CONFIG.course} ${CONFIG.exam} Prep`;
$("#brandName").textContent=CONFIG.course; $("#brandSub").textContent="· "+CONFIG.exam+" Prep";
$("#logo").textContent=(()=>{const w=(CONFIG.course.match(/\b[A-Za-z]/g)||[]);return (w.length>1?w.slice(0,2).join(""):CONFIG.course.replace(/[^A-Za-z0-9]/g,"").slice(0,2)||"EL").toUpperCase();})();
if(!MOCK)$$("[data-nav=mock]").forEach(b=>b.remove());

/* ===== store ===== */
const KEY=CONFIG.storageKey||"examlab";
const DB=(()=>{let d={};try{d=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){} d.stats=d.stats||{};d.missed=d.missed||[];d.exams=d.exams||[];return d;})();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function record(id,ok){const s=DB.stats[id]||{a:0,c:0,last:0};s.a++;if(ok)s.c++;s.last=ok?1:0;DB.stats[id]=s;
  const set=new Set(DB.missed);if(ok)set.delete(id);else set.add(id);DB.missed=[...set];}
const openMissed=()=>DB.missed.filter(id=>ALL[id]);
function lecStats(l){const qs=B.filter(q=>q.l===l&&scorable(q));let a=0,c=0,mast=0;qs.forEach(q=>{const s=DB.stats[q.id];if(s){a+=s.a;c+=s.c;if(s.last)mast++;}});return{n:qs.length,a,c,mast};}

/* ===== session =====
 S={mode:'practice'|'exam',label,ids[],order[][],pick[],done[],show[],flag[],i,t0,deadline,finished} */
let S=DB.session&&DB.session.ids&&DB.session.ids.every(id=>ALL[id])?DB.session:null;
function saveSession(){DB.session=(S&&!S.finished)?S:null;persist();}
function newSession(qs,mode,label){
  S={mode,label,ids:qs.map(q=>q.id),order:qs.map(orderFor),pick:qs.map(()=>null),done:qs.map(()=>false),show:qs.map(()=>false),flag:qs.map(()=>false),i:0,t0:Date.now(),deadline:mode==="exam"?Date.now()+EXAM_MIN*60000:null,finished:false};
  saveSession();go("session");
}
function startGuarded(qs,mode,label){
  if(!qs.length)return;
  if(S&&!S.finished){modal({title:"Replace the session in progress?",body:`You have an unfinished session (“${esc(S.label)}”, ${answeredCount()}/${S.ids.length} answered). Starting a new one discards it.`,
    actions:[{t:"Cancel"},{t:"Resume old session",fn:()=>go("session")},{t:"Start new",primary:1,fn:()=>newSession(qs,mode,label)}]});}
  else newSession(qs,mode,label);
}
const cur=()=>ALL[S.ids[S.i]];
const answeredCount=()=>S.ids.filter((id,k)=>ALL[id].t==="written"?S.show[k]:(S.mode==="exam"?S.pick[k]!==null:S.done[k])).length;
const isDone=k=>ALL[S.ids[k]].t==="written"?true:(S.mode==="exam"||S.done[k]);

/* ===== router ===== */
let V="dash";
function go(v){V=v;stopTimer();
  $$(".nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.nav===v?"page":"false"));
  const m=openMissed().length;$("#mcount").textContent=m||"";$("#mcount").classList.toggle("hidden",!m);
  ({dash:renderDash,mock:renderMock,guide:renderGuide,mistakes:renderMistakes,session:renderSession,results:renderResults})[v]();
  window.scrollTo(0,0);
}
$$(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.nav));

/* ===== modal ===== */
function modal({title,body,actions}){
  const el=$("#modal");
  el.innerHTML=`<div class="modal-bg" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="modal"><h2 id="mt">${title}</h2><p class="muted">${body}</p>
  <div class="acts">${actions.map((a,k)=>`<button class="btn ${a.primary?"primary":"quiet"}" data-k="${k}">${a.t}</button>`).join("")}</div></div></div>`;
  const close=()=>{el.innerHTML="";document.removeEventListener("keydown",esck,true);};
  const esck=e=>{if(e.key==="Escape"){e.stopPropagation();close();}};
  document.addEventListener("keydown",esck,true);
  el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{close();const f=actions[+b.dataset.k].fn;if(f)f();});
  el.querySelector(".modal-bg").onclick=e=>{if(e.target.classList.contains("modal-bg"))close();};
  (el.querySelector(".btn.primary")||el.querySelector(".btn")).focus();
}

/* ===== dashboard ===== */
let cfg={lecs:new Set(LECS),count:"20",hot:false,shuffle:true,type:"all"};
function poolFromCfg(){let p=B.filter(q=>cfg.lecs.has(q.l));if(cfg.hot)p=p.filter(q=>q.h);
  if(cfg.type==="obj")p=p.filter(scorable);if(cfg.type==="written")p=p.filter(q=>!scorable(q));return p;}
function renderDash(){
  const sc=B.filter(scorable);const seen=sc.filter(q=>DB.stats[q.id]).length;
  let a=0,c=0;sc.forEach(q=>{const s=DB.stats[q.id];if(s){a+=s.a;c+=s.c;}});
  const pool=poolFromCfg();const n=cfg.count==="all"?pool.length:Math.min(+cfg.count,pool.length);
  const allSel=cfg.lecs.size===LECS.length;
  const last=DB.exams[DB.exams.length-1],best=DB.exams.reduce((m,e)=>Math.max(m,pct(e.r,e.n)),0);
  const hasHot=B.some(q=>q.h);
  $("#view").innerHTML=`
  ${S&&!S.finished?`<div class="banner"><div><div class="eyebrow" style="color:inherit;opacity:.7">Session in progress</div><b>${esc(S.label)}</b> <span style="opacity:.75">· ${answeredCount()}/${S.ids.length} answered${S.mode==="exam"?" · timer running":""}</span></div><span class="spacer"></span><button class="btn sm" id="discard">Discard</button><button class="btn primary sm" id="resume">Resume</button></div>`:""}
  <section class="hero"><div><div class="eyebrow">${esc(CONFIG.subtitle||"")}</div><h1>${esc(CONFIG.exam)} Prep</h1><p>${esc(CONFIG.course)} · ${LECS.length>1?"Lectures "+LECS.join(", "):"Lecture "+LECS[0]} · ${B.length} practice questions${MOCK?" · "+M.length+"-question mock exam":""}</p></div></section>
  <section class="stats">
    <div class="stat"><span class="v">${seen}<small> / ${sc.length}</small></span><span class="k">Questions attempted</span></div>
    <div class="stat"><span class="v">${a?pct(c,a)+"%":"—"}</span><span class="k">Overall accuracy</span></div>
    <div class="stat"><span class="v">${openMissed().length}</span><span class="k">Open mistakes</span></div>
    <div class="stat"><span class="v">${MOCK?(DB.exams.length?best+"%":"—"):B.filter(q=>q.h).length}</span><span class="k">${MOCK?"Best mock score":"Highlighted questions"}</span></div>
  </section>
  <section class="${MOCK?"two":""}">
    <div class="card builder">
      <div class="card-h" style="margin:0"><h2>Practice session</h2><span class="muted" style="font-size:.85rem">Instant feedback · explanation for every option</span></div>
      ${LECS.length>1?`<div class="field"><span class="label">Lectures</span>
        <div class="chips" id="lchips"><button class="chip" data-all aria-pressed="${allSel}">All lectures <small>${B.length}</small></button>
        ${LECS.map(l=>`<button class="chip" data-l="${esc(l)}" aria-pressed="${!allSel&&cfg.lecs.has(l)}" title="${esc(LNAME[l])}">${esc(l)} <small>${B.filter(q=>q.l===l).length}</small></button>`).join("")}</div>
        <span class="muted" style="font-size:.8rem">${allSel?"All lectures mixed, in random order.":[...cfg.lecs].map(l=>esc(l+" "+LNAME[l])).join(" · ")}</span></div>`:""}
      ${HAS_WRITTEN?`<div class="field"><span class="label">Question type</span><div class="seg" id="tseg">${[["all","All"],["obj","MCQ & T/F"],["written","Written"]].map(([v,t])=>`<button data-t="${v}" aria-pressed="${cfg.type===v}">${t}</button>`).join("")}</div></div>`:""}
      <div class="row" style="gap:24px;align-items:flex-end">
        <div class="field"><span class="label">Questions</span><div class="seg" id="cseg">${["10","20","40","all"].map(x=>`<button data-c="${x}" aria-pressed="${cfg.count===x}">${x==="all"?"All":x}</button>`).join("")}</div></div>
        <div class="field">${hasHot?`<label class="toggle"><input type="checkbox" id="thot" ${cfg.hot?"checked":""}> Highlighted points only</label>`:""}
          <label class="toggle"><input type="checkbox" id="tshuf" ${cfg.shuffle?"checked":""}> Random order</label></div>
      </div>
      <div class="builder-foot"><span class="muted" style="font-size:.85rem">${pool.length} questions match</span>
        <button class="btn primary" id="startP" ${n?"":"disabled"}>Start ${n} questions</button></div>
    </div>
    ${MOCK?`<div class="card mock">
      <div class="card-h" style="margin:0"><h2>Mock ${esc(CONFIG.exam.toLowerCase())}</h2><span class="tag">Exam mode</span></div>
      <p class="muted" style="font-size:.9rem">New questions that are not in the practice bank, in the style of the real exam. No feedback until you submit.</p>
      <div class="facts"><div><b>${M.length}</b><span>questions</span></div><div><b>${EXAM_MIN}</b><span>minutes</span></div><div><b>${last?pct(last.r,last.n)+"%":"—"}</b><span>last score</span></div></div>
      <button class="btn dark" id="goMock">Open mock exam</button></div>`:""}
  </section>
  ${CONFIG.notes&&CONFIG.notes.length?`<section class="notes"><h3>Exam focus notes</h3><ul>${CONFIG.notes.map(x=>`<li>${x}</li>`).join("")}</ul></section>`:""}
  <section class="card"><div class="card-h"><h2>${LECS.length>1?"Lectures":"Lecture"}</h2><span class="muted" style="font-size:.85rem">Mastered = your last answer was correct</span></div>
    <div class="scroll-x"><table class="table"><thead><tr><th>Lec</th><th>Topic</th><th class="hide-s">Priority</th><th>Mastered</th><th class="hide-s">Accuracy</th><th></th></tr></thead><tbody>
    ${LECS.map(l=>{const s=lecStats(l);return `<tr><td class="lec">${esc(l)}</td><td>${esc(LNAME[l])}</td><td class="hide-s">${PRIO[l]?`<span class="prio ${isTop(PRIO[l])?"top":""}">${esc(PRIO[l])}</span>`:""}</td>
      <td class="mast"><div class="row"><div class="track"><i style="width:${pct(s.mast,s.n)}%"></i></div><span class="mono muted" style="font-size:.78rem">${s.mast}/${s.n}</span></div></td>
      <td class="hide-s mono">${s.a?pct(s.c,s.a)+"%":"—"}</td><td style="text-align:right"><button class="btn sm quiet" data-pl="${esc(l)}">Practice</button></td></tr>`;}).join("")}
    </tbody></table></div></section>`;
  const r=$("#resume");if(r)r.onclick=()=>go("session");
  const d=$("#discard");if(d)d.onclick=()=>modal({title:"Discard this session?",body:"Answers already given stay in your stats. The session itself is removed.",actions:[{t:"Cancel"},{t:"Discard",primary:1,fn:()=>{S=null;saveSession();renderDash();}}]});
  $$("#lchips .chip").forEach(b=>b.onclick=()=>{
    if(b.hasAttribute("data-all"))cfg.lecs=new Set(LECS);
    else{const l=b.dataset.l;if(cfg.lecs.size===LECS.length)cfg.lecs=new Set([l]);else if(cfg.lecs.has(l)){cfg.lecs.delete(l);if(!cfg.lecs.size)cfg.lecs=new Set(LECS);}else cfg.lecs.add(l);}
    cfg.shuffle=cfg.lecs.size>1;renderDash();});
  $$("#cseg button").forEach(b=>b.onclick=()=>{cfg.count=b.dataset.c;renderDash();});
  $$("#tseg button").forEach(b=>b.onclick=()=>{cfg.type=b.dataset.t;renderDash();});
  const th=$("#thot");if(th)th.onchange=e=>{cfg.hot=e.target.checked;renderDash();};
  $("#tshuf").onchange=e=>{cfg.shuffle=e.target.checked;};
  $("#startP").onclick=()=>{let p=poolFromCfg();if(cfg.shuffle)p=shuffle(p);if(cfg.count!=="all")p=p.slice(0,+cfg.count);
    startGuarded(p,"practice",(cfg.lecs.size===LECS.length?(LECS.length>1?"All lectures":"Lecture "+LECS[0]):"Lecture "+[...cfg.lecs].join(", "))+(cfg.hot?" · Highlighted":"")+(cfg.type==="written"?" · Written":cfg.type==="obj"?" · MCQ & T/F":""));};
  const gm=$("#goMock");if(gm)gm.onclick=()=>go("mock");
  $$("[data-pl]").forEach(b=>b.onclick=()=>{const l=b.dataset.pl;startGuarded(B.filter(q=>q.l===l),"practice","Lecture "+l+" · "+LNAME[l]);});
}

/* ===== mock intro ===== */
function renderMock(){
  if(!MOCK){go("dash");return;}
  const d={};M.forEach(q=>d[q.l]=(d[q.l]||0)+1);const mx=Math.max(...Object.values(d));
  const inExam=S&&!S.finished&&S.mode==="exam";
  const label=`${M.length} questions · ${EXAM_MIN} minutes`;
  $("#view").innerHTML=`
  <section class="hero"><div><div class="eyebrow">Exam mode</div><h1>Mock ${esc(CONFIG.exam)}</h1><p>${M.length} new questions · ${EXAM_MIN} minutes · results and explanations after you submit</p></div></section>
  <section class="two">
    <div class="card" style="display:flex;flex-direction:column;gap:14px"><h2>How it works</h2>
      <ul style="margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px">
        <li>No feedback while you answer, like the real exam.</li>
        <li>Move freely between questions with the navigator. Flag questions you want to revisit.</li>
        <li>The timer keeps running if you leave the page. At 0:00 the exam submits automatically.</li>
        ${M.some(q=>q.t==="written")?"<li>Written questions are not auto-graded: reveal the model answer and mark yourself.</li>":""}
        <li>After submitting: score, accuracy by lecture, what to focus on, full review with explanations, and a retry of only the questions you missed.</li></ul>
      <div class="row">${inExam?`<button class="btn primary" id="resumeM">Resume exam</button>`:`<button class="btn primary" id="startM">Start mock exam</button>`}</div></div>
    <div class="card"><div class="card-h"><h2>Question split</h2></div><div class="lrows">
      ${LECS.filter(l=>d[l]).map(l=>`<div class="lrow"><span class="n">${esc(l)}</span><span class="t">${esc(LNAME[l])}</span><div class="track"><i style="width:${d[l]/mx*100}%"></i></div><span class="v">${d[l]}</span></div>`).join("")}
    </div></div>
  </section>
  ${DB.exams.length?`<section class="card"><div class="card-h"><h2>Attempts</h2></div><table class="table"><thead><tr><th>#</th><th>Date</th><th>Score</th><th>Time</th></tr></thead><tbody>
    ${DB.exams.slice().reverse().map((e,k)=>`<tr><td class="mono">${DB.exams.length-k}</td><td>${new Date(e.at).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</td><td class="mono">${e.r}/${e.n} · ${pct(e.r,e.n)}%</td><td class="mono">${e.min} min</td></tr>`).join("")}</tbody></table></section>`:""}`;
  const s=$("#startM");if(s)s.onclick=()=>startGuarded(M.slice(),"exam",label);
  const r=$("#resumeM");if(r)r.onclick=()=>go("session");
}

/* ===== session ===== */
let timerH=null;
function fmt(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
function startTimer(){stopTimer();timerH=setInterval(()=>{if(!S||S.finished||S.mode!=="exam"||V!=="session"){stopTimer();return;}
  const left=S.deadline-Date.now();const el=$("#timer");if(el){el.textContent=fmt(left);el.classList.toggle("low",left<5*60000);}
  if(left<=0){stopTimer();finish();}},500);}
function stopTimer(){if(timerH){clearInterval(timerH);timerH=null;}}

function optionButtons(q,order,pick,reveal){
  return order.map((oi,pos)=>{let cls="opt",st="";
    if(reveal){if(oi===0){cls+=" correct";st=pick===0?"Your answer ✓":"Correct answer";}else if(pick===oi){cls+=" picked";st="Your answer ✗";}else cls+=" dim";}
    else if(pick===oi)cls+=" sel";
    return `<button class="${cls}" data-oi="${oi}" ${reveal?"disabled":""} aria-label="Option ${LET[pos]}"><span class="let">${LET[pos]}</span><span class="txt">${st?`<span class="st">${st}</span>`:""}<span class="t">${esc(q.o[oi][0])}</span></span></button>`;}).join("");
}
function explanation(q,order,pick){
  if(q.t==="written")return modelAnswer(q);
  return `<section class="explain">${q.k?`<div class="ex-key" dir="auto"><span class="lbl">Key idea</span>${q.k}</div>`:""}
  ${order.map((oi,pos)=>{const c=oi===0,p=pick===oi&&!c;const cls=c?"c":(p?"p":"o-other");
    const st=c?(pick===0?"Correct · your answer":"Correct"):(p?"Your answer":"Incorrect");
    return `<div class="ex-row ${cls}"><div class="eh"><span class="let">${LET[pos]}</span><span class="o">${esc(q.o[oi][0])}</span><span class="s">${st}</span></div><p class="e" dir="auto">${q.o[oi][1]}</p></div>`;}).join("")}</section>`;
}
function modelAnswer(q){
  return `<section class="model"><div class="model-h"><span class="hl">Model answer</span></div><div class="model-a">${q.a}</div>${q.k?`<div class="ex-key" dir="auto"><span class="lbl">Note</span>${q.k}</div>`:""}</section>`;
}
function renderSession(){
  if(!S){go("dash");return;}
  if(S.mode==="exam"&&!S.finished&&Date.now()>=S.deadline){finish();return;}
  const exam=S.mode==="exam",i=S.i,q=cur(),n=S.ids.length,w=q.t==="written";
  const reveal=!exam&&!w&&S.done[i];
  const right=S.ids.filter((id,k)=>S.done[k]&&S.pick[k]===0).length,wrong=S.ids.filter((id,k)=>S.done[k]&&scorable(ALL[id])&&S.pick[k]!==0).length;
  const canNext=isDone(i), isLast=i===n-1;
  const typeTag=q.t==="tf"?"True / False":w?"Written":"MCQ";
  $("#view").innerHTML=`
  <section class="sess-head"><div class="title"><span class="eyebrow">${exam?"Mock "+esc(CONFIG.exam.toLowerCase()):"Practice"}</span><b>${esc(S.label)}</b></div><span class="spacer"></span>
    ${exam?`<span class="timer" id="timer">${fmt(S.deadline-Date.now())}</span>`:`<div class="tally"><span>Correct <b>${right}</b></span><span>Incorrect <b>${wrong}</b></span></div>`}
    <button class="btn sm quiet" id="exit">Exit</button></section>
  <div class="pbar"><i style="width:${answeredCount()/n*100}%"></i></div>
  <div class="sgrid ${exam?"exam":""}">
    <article class="qcard">
      <div class="qmeta"><span class="tag">Lecture ${esc(q.l)} · ${esc(LNAME[q.l]||"")}</span><span class="tag">${typeTag}</span>${q.h?`<span class="hl">Highlighted</span>`:""}${exam&&S.flag[i]?`<span class="tag">⚑ Flagged</span>`:""}<span class="qno">Question ${i+1} of ${n}</span></div>
      <h2 class="qtext">${q.html?q.q:esc(q.q)}</h2>
      ${w?`${S.show[i]?modelAnswer(q):`<div class="write-hint">Answer on paper or in your head, then compare with the model answer.</div>`}
          <div class="row"><button class="btn ${S.show[i]?"quiet":"dark"}" id="revealW">${S.show[i]?"Hide model answer":"Show model answer"}</button></div>`
        :`<div class="opts">${optionButtons(q,S.order[i],S.pick[i],reveal)}</div>
      ${reveal?`<div class="verdict ${S.pick[i]===0?"ok":"no"}"><b>${S.pick[i]===0?"Correct":"Incorrect · Answer: "+LET[S.order[i].indexOf(0)]}</b><span class="spacer"></span>
        <button class="btn sm ${S.pick[i]===0?"quiet":""}" id="exBtn" aria-expanded="${S.show[i]}">${S.show[i]?"Hide explanation":(S.pick[i]===0?"Why each option":"Explain this question")}</button></div>
        ${S.show[i]?explanation(q,S.order[i],S.pick[i]):""}`:""}`}
      <div class="qfoot"><button class="btn quiet" id="prev" ${i===0?"disabled":""}>← Previous</button>
        ${exam?`<button class="btn quiet" id="flag">${S.flag[i]?"Unflag":"⚑ Flag"}</button>`:""}<span class="spacer"></span>
        <span class="hints">${w?"<span><kbd>E</kbd> model answer</span>":`<span><kbd>1</kbd>–<kbd>${q.o.length}</kbd> answer</span>${exam?"<span><kbd>F</kbd> flag</span>":"<span><kbd>E</kbd> explain</span>"}`}<span><kbd>Enter</kbd> next</span></span>
        ${isLast?`<button class="btn primary" id="finish" ${canNext?"":"disabled"}>${exam?"Submit exam":"Finish"}</button>`:`<button class="btn primary" id="next" ${canNext?"":"disabled"}>Next →</button>`}</div>
    </article>
    ${exam?`<aside class="navp"><div class="row"><h3>Questions</h3><span class="spacer"></span><span class="mono muted" style="font-size:.8rem">${answeredCount()}/${n}</span></div>
      <div class="pal">${S.ids.map((id,k)=>{const a=ALL[id].t==="written"?S.show[k]:S.pick[k]!==null;return `<button data-k="${k}" class="${a?"a":""} ${S.flag[k]?"f":""} ${k===i?"cur":""}" aria-label="Question ${k+1}">${k+1}</button>`;}).join("")}</div>
      <div class="legend"><span><i class="a"></i>Answered</span><span><i></i>Unanswered</span><span><i class="f"></i>Flagged</span></div>
      <button class="btn primary" id="submit2">Submit exam</button></aside>`:""}
  </div>`;
  $$(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  const ex=$("#exBtn");if(ex)ex.onclick=toggleExplain;
  const rw=$("#revealW");if(rw)rw.onclick=toggleExplain;
  $("#prev").onclick=()=>move(-1);
  const nx=$("#next");if(nx)nx.onclick=()=>move(1);
  const fi=$("#finish");if(fi)fi.onclick=askFinish;
  const s2=$("#submit2");if(s2)s2.onclick=askFinish;
  const fl=$("#flag");if(fl)fl.onclick=()=>{S.flag[S.i]=!S.flag[S.i];saveSession();renderSession();};
  $$(".pal button").forEach(b=>b.onclick=()=>{S.i=+b.dataset.k;saveSession();renderSession();});
  $("#exit").onclick=askExit;
  if(exam)startTimer();
}
function choose(oi){const i=S.i,q=cur();if(q.t==="written")return;
  if(S.mode==="exam"){S.pick[i]=oi;saveSession();renderSession();return;}
  if(S.done[i])return;S.pick[i]=oi;S.done[i]=true;record(q.id,oi===0);saveSession();renderSession();}
function toggleExplain(){S.show[S.i]=!S.show[S.i];if(cur().t==="written")S.done[S.i]=true;saveSession();renderSession();}
function move(d){const j=S.i+d;if(j<0||j>=S.ids.length)return;if(d>0&&!isDone(S.i))return;S.i=j;saveSession();renderSession();window.scrollTo(0,0);}
function askFinish(){
  if(S.mode==="exam"){const un=S.ids.filter((id,k)=>scorable(ALL[id])&&S.pick[k]===null).length,fl=S.flag.filter(Boolean).length;
    if(un||fl){modal({title:"Submit the exam?",body:[un?`${un} unanswered`:"",fl?`${fl} flagged`:""].filter(Boolean).join(" · ")+". Unanswered questions count as incorrect.",actions:[{t:"Keep working"},{t:"Submit",primary:1,fn:finish}]});return;}}
  finish();
}
function askExit(){
  const acts=[{t:"Cancel"},{t:"Save & exit",fn:()=>go("dash")}];
  if(S.mode==="practice"&&S.done.some(Boolean))acts.push({t:"End & see results",primary:1,fn:finish});
  if(S.mode==="exam")acts.push({t:"Submit now",primary:1,fn:finish});
  modal({title:"Leave this session?",body:S.mode==="exam"?"Your answers are saved and you can resume from the dashboard. The timer keeps running.":"Your progress is saved. You can resume it from the dashboard.",actions:acts});
}
function finish(){
  stopTimer();if(!S)return;
  if(S.mode==="exam"){S.ids.forEach((id,k)=>{S.done[k]=true;if(scorable(ALL[id]))record(id,S.pick[k]===0);});
    const sc=S.ids.map((id,k)=>k).filter(k=>scorable(ALL[S.ids[k]]));
    DB.exams.push({at:Date.now(),r:sc.filter(k=>S.pick[k]===0).length,n:sc.length,min:Math.max(1,Math.round((Math.min(Date.now(),S.deadline)-S.t0)/60000))});}
  S.finished=true;S.endedAt=Date.now();DB.lastResult=S;saveSession();go("results");
}
document.addEventListener("keydown",e=>{
  if(V!=="session"||!S||S.finished||$("#modal").innerHTML||e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target.tagName;if(t==="INPUT"||t==="TEXTAREA")return;
  const q=cur(),k=e.key.toLowerCase(),map={"1":0,"2":1,"3":2,"4":3,"5":4,"a":0,"b":1,"c":2,"d":3};
  if(q.t!=="written"&&k in map&&map[k]<q.o.length){const oi=S.order[S.i][map[k]];if(S.mode==="exam"||!S.done[S.i])choose(oi);e.preventDefault();}
  else if(k==="e"&&(q.t==="written"||(S.mode!=="exam"&&S.done[S.i])))toggleExplain();
  else if(k==="f"&&S.mode==="exam"){S.flag[S.i]=!S.flag[S.i];saveSession();renderSession();}
  else if(k==="enter"||k==="arrowright"){const b=$("#next")||$("#finish");if(b&&!b.disabled){e.preventDefault();b.click();}}
  else if(k==="arrowleft")move(-1);
});

/* ===== results ===== */
function renderResults(){
  const R=DB.lastResult;if(!R||!R.ids.every(id=>ALL[id])){go("dash");return;}
  const exam=R.mode==="exam";
  const idx=R.ids.map((id,k)=>k).filter(k=>scorable(ALL[R.ids[k]])&&(exam||R.done[k]));
  const widx=R.ids.map((id,k)=>k).filter(k=>!scorable(ALL[R.ids[k]])&&(exam||R.show[k]));
  const total=idx.length,right=idx.filter(k=>R.pick[k]===0).length,wrongIdx=idx.filter(k=>R.pick[k]!==0);
  const p=pct(right,total);const grade=p>=85?"Excellent":p>=70?"Good":p>=50?"Needs review":"Weak";
  const per={};idx.forEach(k=>{const l=ALL[R.ids[k]].l;per[l]=per[l]||{n:0,r:0};per[l].n++;if(R.pick[k]===0)per[l].r++;});
  const ls=LECS.filter(l=>per[l]);
  const weak=ls.map(l=>({l,...per[l],acc:per[l].r/per[l].n})).filter(x=>x.r<x.n).sort((a,b)=>a.acc-b.acc||(b.n-b.r)-(a.n-a.r));
  const focus=weak.filter(x=>x.acc<0.8).slice(0,3);const fshow=focus.length?focus:weak.slice(0,1);
  const C=2*Math.PI*56;
  $("#view").innerHTML=`
  <section class="card"><div class="res-top">
    <div class="ring"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="56" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="66" cy="66" r="56" fill="none" stroke="var(--yellow)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-(total?right/total:0))}"/></svg>
      <div class="c"><div><b>${p}%</b><span>${right} / ${total}</span></div></div></div>
    <div class="res-meta"><span class="eyebrow">${exam?"Mock exam result":"Practice result"} · ${esc(R.label)}</span>
      <h1>${right} correct out of ${total}</h1><span class="grade ${p>=70?"top":""}">${grade}</span>
      <span class="muted" style="font-size:.88rem">${wrongIdx.length} to review${widx.length?` · ${widx.length} written (self-check)`:""}${exam?` · ${Math.max(1,Math.round((Math.min(R.endedAt,R.deadline)-R.t0)/60000))} min`:""}</span>
      <div class="row" style="margin-top:6px">${wrongIdx.length?`<button class="btn primary" id="retry">Retry the ${wrongIdx.length} incorrect</button>`:""}
        <button class="btn quiet" id="again">${exam?"Retake mock exam":"New practice session"}</button><button class="btn quiet" id="home">Dashboard</button></div></div></div></section>
  <section class="two">
    <div class="card"><div class="card-h"><h2>Focus next</h2></div>
      ${!total?`<p class="muted">No auto-graded questions answered.</p>`:!weak.length?`<p>No mistakes in this set. Next step: a larger mixed session${MOCK?" or the mock exam":""}.</p>`:
      `<div class="focus-list">${fshow.map(x=>`<div class="focus-item"><span class="n">${esc(x.l)}</span><span class="d"><b>${esc(LNAME[x.l])}</b><br><span class="muted">${x.n-x.r} of ${x.n} incorrect · ${Math.round(x.acc*100)}% accuracy</span></span>${G[x.l]?`<button class="btn sm quiet" data-fg="${esc(x.l)}">Study guide</button>`:""}<button class="btn sm dark" data-fp="${esc(x.l)}">Practice ${esc(x.l)}</button></div>`).join("")}</div>
      <p class="muted" style="font-size:.85rem;margin-top:12px">Read the lecture in the study guide, practise it on its own, then retry your incorrect answers until none are left.</p>`}</div>
    <div class="card"><div class="card-h"><h2>By lecture</h2></div><div class="lrows">
      ${ls.map(l=>`<div class="lrow"><span class="n">${esc(l)}</span><span class="t">${esc(LNAME[l])}</span><div class="track"><i style="width:${per[l].r/per[l].n*100}%"></i></div><span class="v">${per[l].r}/${per[l].n}</span></div>`).join("")||`<p class="muted">—</p>`}</div></div>
  </section>
  <section style="display:flex;flex-direction:column;gap:12px">
    <div class="row"><h2>Review</h2><span class="spacer"></span><div class="seg"><button id="fw" aria-pressed="${wrongIdx.length>0}">Incorrect (${wrongIdx.length})</button><button id="fa" aria-pressed="${!wrongIdx.length}">All (${total+widx.length})</button></div></div>
    <div class="rev" id="rev"></div></section>`;
  let only=wrongIdx.length>0;
  const all=R.ids.map((id,k)=>k).filter(k=>idx.includes(k)||widx.includes(k));
  const draw=()=>{$("#fw").setAttribute("aria-pressed",only);$("#fa").setAttribute("aria-pressed",!only);
    const list=only?wrongIdx:all;
    $("#rev").innerHTML=list.length?list.map(k=>{const q=ALL[R.ids[k]],pk=R.pick[k],w=q.t==="written",ok=pk===0;
      const badge=w?`<span class="rs skip">Written</span>`:`<span class="rs ${ok?"ok":pk===null?"skip":"no"}">${ok?"Correct":pk===null?"Unanswered":"Incorrect"}</span>`;
      return `<details class="ritem"><summary><span class="rn">${k+1}</span><span class="rq"><span class="row" style="gap:6px">${badge}<span class="tag">Lecture ${esc(q.l)}</span></span><span>${q.html?q.q:esc(q.q)}</span></span><span class="chev">›</span></summary>
      <div class="body">${w?"":`<div class="opts">${optionButtons(q,R.order[k],pk,true)}</div>`}${explanation(q,R.order[k],pk)}</div></details>`;}).join(""):`<div class="card empty">Nothing to review here.</div>`;};
  $("#fw").onclick=()=>{only=true;draw();};$("#fa").onclick=()=>{only=false;draw();};draw();
  const rt=$("#retry");if(rt)rt.onclick=()=>startGuarded(shuffle(wrongIdx.map(k=>ALL[R.ids[k]])),"practice","Retry · incorrect answers");
  $("#again").onclick=()=>exam?startGuarded(M.slice(),"exam",`${M.length} questions · ${EXAM_MIN} minutes`):go("dash");
  $("#home").onclick=()=>go("dash");
  $$("[data-fp]").forEach(b=>b.onclick=()=>{const l=b.dataset.fp;startGuarded(B.filter(q=>q.l===l),"practice","Lecture "+l+" · "+LNAME[l]);});
  $$("[data-fg]").forEach(b=>b.onclick=()=>{go("guide");const el=document.getElementById(gid(b.dataset.fg));if(el)el.scrollIntoView();});
}

/* ===== mistakes ===== */
function renderMistakes(){
  const ids=openMissed(),byL={};ids.forEach(id=>{const l=ALL[id].l;(byL[l]=byL[l]||[]).push(id);});
  $("#view").innerHTML=`
  <section class="hero"><div><div class="eyebrow">Saved automatically</div><h1>Mistakes</h1><p>Every question you answered incorrectly stays here until you answer it correctly.</p></div>
    <div class="row">${ids.length?`<button class="btn quiet" id="clr">Clear all</button><button class="btn primary" id="pm">Practice all ${ids.length}</button>`:""}</div></section>
  ${!ids.length?`<div class="card empty">No open mistakes. Start a practice session from the dashboard.</div>`:`
  <section class="card"><div class="lrows">${LECS.filter(l=>byL[l]).map(l=>`<div class="lrow" style="grid-template-columns:44px minmax(0,1fr) 70px auto"><span class="n">${esc(l)}</span><span class="t">${esc(LNAME[l])}</span><span class="v">${byL[l].length} open</span><button class="btn sm quiet" data-ml="${esc(l)}">Practice</button></div>`).join("")}</div></section>
  <section class="rev">${ids.map((id,k)=>{const q=ALL[id];return `<details class="ritem"><summary><span class="rn">${k+1}</span><span class="rq"><span class="row" style="gap:6px"><span class="tag">Lecture ${esc(q.l)}</span>${q.h?`<span class="hl">Highlighted</span>`:""}</span><span>${q.html?q.q:esc(q.q)}</span></span><span class="chev">›</span></summary>
    <div class="body">${explanation(q,orderFor(q),null)}</div></details>`;}).join("")}</section>`}`;
  const pm=$("#pm");if(pm)pm.onclick=()=>startGuarded(shuffle(ids.map(id=>ALL[id])),"practice","Mistakes · all lectures");
  $$("[data-ml]").forEach(b=>b.onclick=()=>startGuarded(shuffle(byL[b.dataset.ml].map(id=>ALL[id])),"practice","Mistakes · Lecture "+b.dataset.ml));
  const c=$("#clr");if(c)c.onclick=()=>modal({title:"Clear all mistakes?",body:"This empties the list. Your accuracy stats are kept.",actions:[{t:"Cancel"},{t:"Clear",primary:1,fn:()=>{DB.missed=[];persist();go("mistakes");}}]});
}

/* ===== study guide ===== */
const gid=l=>"g-"+String(l).replace(/[^A-Za-z0-9]/g,"-");
function renderGuide(){
  const style=CONFIG.style||[];
  $("#view").innerHTML=`
  <section class="hero"><div><div class="eyebrow">Lecture analysis</div><h1>Study Guide</h1><p>Key points and exam traps for each lecture. Explanations are in Arabic with English terms.</p></div></section>
  ${style.length?`<section class="notes"><h3>How this course asks questions</h3><ul>${style.map(x=>`<li>${x}</li>`).join("")}</ul></section>`:""}
  <div class="guide"><nav class="toc">${LECS.filter(l=>G[l]).map(l=>`<a href="#${gid(l)}"><b>${esc(l)}</b>${esc(LNAME[l])}</a>`).join("")}</nav>
  <div style="display:flex;flex-direction:column;gap:16px">${LECS.filter(l=>G[l]).map(l=>{const g=G[l];return `<section class="card gsec" id="${gid(l)}">
    <div class="row"><span class="mono" style="font-weight:600">${esc(l)}</span><h2>${esc(LNAME[l])}</h2><span class="spacer"></span>${PRIO[l]?`<span class="prio ${isTop(PRIO[l])?"top":""}">${esc(PRIO[l])} priority</span>`:""}</div>
    <ul class="ar">${(g.pts||[]).map(x=>`<li>${x}</li>`).join("")}</ul>
    ${g.traps&&g.traps.length?`<div class="traps"><span class="lbl"><span class="hl">Exam traps</span></span><ul class="ar">${g.traps.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
    <div class="row"><button class="btn sm dark" data-gp="${esc(l)}">Practice ${esc(l)} · ${B.filter(q=>q.l===l).length} questions</button></div></section>`;}).join("")||`<div class="card empty">No study guide for this set.</div>`}</div></div>`;
  $$("[data-gp]").forEach(b=>b.onclick=()=>{const l=b.dataset.gp;startGuarded(B.filter(q=>q.l===l),"practice","Lecture "+l+" · "+LNAME[l]);});
  $$(".toc a").forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.querySelector(a.getAttribute("href"));if(el)el.scrollIntoView({behavior:"smooth"});});
}
go("dash");

</script>
</body>
</html>
