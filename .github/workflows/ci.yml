name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install pyyaml pytest genanki sympy

      - name: Validate skills
        run: python scripts/validate_skills.py

      - name: Run tests
        run: pytest -q

      - name: Python syntax check for all skill scripts
        run: python -m py_compile $(find skills -name '*.py')

      - name: JavaScript syntax check
        run: node --check skills/exam-lab/scripts/check.js
